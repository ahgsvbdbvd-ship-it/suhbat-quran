<head>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>تسجيل الصلاة — صحبة القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/islamic.css">

<body><div id="appPreloader"><div class="pre-logo">📖</div><div class="pre-text">صحبة القرآن</div><div class="pre-bar"><span></span></div></div>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="index.html" title="الرجوع للرئيسية">→</a>
  <div class="brand"><span class="logo">🕌</span><span>تسجيل الصلاة</span></div>
  <span class="spacer"></span>
  <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌓</button>
</div></header>
<main class="container" style="max-width:600px">
  <div class="card hero-card center" id="nextCard">🕌 جارٍ تحميل المواقيت…</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <button class="icon-btn" id="salahPrev" title="السابق">▶</button>
      <h3 id="salahTitle" style="margin:0;text-align:center">اليوم</h3>
      <button class="icon-btn" id="salahNext" title="التالي">◀</button>
    </div>
    <div class="center mt"><button class="chip-btn" id="salahToday">🎯 اليوم</button></div>
    <div style="height:10px"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>صلوات اليوم</b><b id="salahProgLbl">0 / 5</b>
    </div>
    <div class="progress mt"><span id="salahProgBar"></span></div>
    <p class="muted" id="approxNote" style="display:none">⚠️ أوقات تقريبية (تعذّر الاتصال) — ستُحدَّث تلقائيًا عند توفر الإنترنت.</p>
  </div>
  <div id="prayerList"></div>
  <p class="muted center">المواقيت لمدينة القاهرة — الهيئة المصرية العامة للمساحة — بتوقيت Africa/Cairo.<br>المصدر: Aladhan API (مجاني).</p>
  <div class="card center"><a class="btn btn-ghost" href="points.html">🏆 نقاطي ومستوياتي</a></div>
</main>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/salah.js"></script>
