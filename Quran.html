<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="js/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>القرآن الكريم — صحبة القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/islamic.css">
<link rel="stylesheet" href="css/responsive.css">
<style>body{font-family:"Cairo","Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",Arial,sans-serif}</style>
</head>
<body><div id="appPreloader"><div class="pre-logo">📖</div><div class="pre-text">صحبة القرآن</div><div class="pre-bar"><span></span></div></div>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="index.html" title="الرجوع للرئيسية">→</a>
  <div class="brand"><span class="logo">📖</span><span>القرآن الكريم</span></div>
  <span class="spacer"></span>
  <a class="icon-btn" href="mushaf.html" title="وضع المصحف">📖</a>
  <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌓</button>
</div></header>
<main class="container">
  <div class="searchbar"><input id="surahSearch" placeholder="🔍 ابحث عن سورة… (مثال: البقرة)"></div>
  <div class="tabs">
    <button class="tab active" data-t="surah">السور</button>
    <button class="tab" data-t="ayah">بحث في الآيات</button>
  </div>
  <div class="card center frame-gold"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <h3 style="margin-top:0">🎧 الاستماع للقرآن الكريم</h3>
    <p class="muted">8 من كبار الشيوخ — اختر قارئك المفضل واستمع سورة سورة مع إبراز الآيات.</p>
    <a class="btn btn-gold btn-block" href="listen.html">فتح مشغل التلاوة 🎙️</a>
  </div>
  <p class="muted" id="srcNote">نص الآيات من مصدر Tanzil الموثوق (الرسم العثماني) ويُحفظ على جهازك للعمل دون اتصال.</p>
  <div id="surahList"></div>
  <div id="ayahResults"></div>
</main>
<script src="js/storage.js"></script>`n<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="data/quran-data.js"></script>
<script src="js/quran.js"></script>
<script>
(function(){
  "use strict";
  var tab="surah",deb=null;
  function renderSurahs(q){
    var res=QuranAPI.searchSurahs(q);
    var box=document.getElementById("surahList");
    box.innerHTML=res.length?res.map(function(s){
      return '<a class="list-row" href="surah.html?n='+s.n+'"><span class="num">'+s.n+'</span>'+
        '<div style="flex:1"><b>سورة '+App.esc(s.name)+'</b><div class="muted">'+s.ayahs+' آيات • '+s.type+'</div></div><span>←</span></a>';
    }).join(""):'<div class="empty">لا توجد نتائج.</div>';
  }
  function searchAyahs(q){
    var box=document.getElementById("ayahResults");
    if(q.trim().length<2){box.innerHTML='<div class="empty">اكتب كلمتين على الأقل للبحث في نص الآيات.</div>';return;}
    box.innerHTML='<div class="empty">جارٍ البحث…</div>';
    fetch("https://api.alquran.cloud/v1/search/"+encodeURIComponent(q)+"/all/quran-uthmani")
      .then(function(r){return r.json();})
      .then(function(j){
        var matches=(j.data&&j.data.matches)||[];
        if(!matches.length){box.innerHTML='<div class="empty">لا توجد نتائج.</div>';return;}
        box.innerHTML='<p class="muted">نتائج: '+j.data.count+'</p>'+matches.slice(0,30).map(function(m){
          var meta=window.surahMeta(m.surah.number);
          return '<a class="list-row" href="surah.html?n='+m.surah.number+'&ayah='+m.numberInSurah+'"><span style="font-size:22px">📖</span>'+
            '<div style="flex:1"><b>سورة '+(meta?meta.name:m.surah.name)+' — آية '+m.numberInSurah+'</b><div class="muted">'+App.esc(m.text.slice(0,120))+'…</div></div></a>';
        }).join("");
      })
      .catch(function(){box.innerHTML='<div class="empty">تعذر البحث (لا يوجد اتصال). جرّب البحث في أسماء السور.</div>';});
  }
  document.addEventListener("DOMContentLoaded",function(){
    renderSurahs("");
    document.getElementById("surahSearch").addEventListener("input",function(e){
      var v=e.target.value;
      clearTimeout(deb);
      deb=setTimeout(function(){
        if(tab==="surah")renderSurahs(v);else searchAyahs(v);
      },350);
    });
    document.querySelectorAll(".tabs .tab").forEach(function(b){
      b.addEventListener("click",function(){
        tab=b.dataset.t;
        document.querySelectorAll(".tabs .tab").forEach(function(x){x.classList.remove("active");});
        b.classList.add("active");
        document.getElementById("surahList").style.display=tab==="surah"?"":"none";
        document.getElementById("ayahResults").style.display=tab==="ayah"?"":"none";
        document.getElementById("surahSearch").placeholder=tab==="surah"?"🔍 ابحث عن سورة… (مثال: البقرة)":"🔍 ابحث في نص الآيات… (مثال: نور)";
        if(tab==="ayah")searchAyahs(document.getElementById("surahSearch").value);
      });
    });
    document.getElementById("ayahResults").style.display="none";
  });
})();
</script>
</body>
</html>
