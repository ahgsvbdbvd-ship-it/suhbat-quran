<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="js/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>الاستماع للقرآن — صحبة القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/islamic.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
body{font-family:"Cairo","Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",Arial,sans-serif}
#ayahList .ayah-block{width:100%;text-align:right;background:none;border:none;border-bottom:1px dashed rgba(13,122,95,.25);padding:12px 4px;cursor:pointer;font-family:inherit;color:inherit}
#ayahList .ayah-block.on-air{background:linear-gradient(160deg,rgba(14,164,114,.16),rgba(201,162,75,.12));border-radius:12px;border:1px solid rgba(201,162,75,.5)}
.player-btns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.play-main{width:88px;height:88px;min-width:88px;border-radius:50%;border:3px solid rgba(236,210,138,.85);font-size:32px;line-height:1;cursor:pointer;color:#fff;font-family:inherit;
  display:inline-grid;place-items:center;
  background:linear-gradient(150deg,#17b57f,var(--emerald-deep));box-shadow:0 14px 34px rgba(6,78,59,.45),0 0 0 8px rgba(201,162,75,.12);transition:transform .12s}
.play-main:active{transform:scale(.93)}
#lisPrev,#lisNext{border-radius:50%;width:54px;height:54px;min-width:54px;font-size:20px}
.lis-title-wrap{margin:0}
.lis-divider{display:flex;align-items:center;gap:8px;color:var(--gold);margin:8px auto;max-width:220px}
.lis-divider::before,.lis-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#curAyah{min-height:64px;display:flex;align-items:center;justify-content:center;margin:8px 0}
#lisCount{font-weight:800;font-size:15px;margin:6px 0}
#lisBar{transition:width .3s}
</style>
</head>
<body><div id="appPreloader"><div class="pre-logo">📖</div><div class="pre-text">صحبة القرآن</div><div class="pre-bar"><span></span></div></div>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="index.html" title="الرجوع للرئيسية">→</a>
  <a class="icon-btn" href="quran.html" title="الرجوع للقرآن">📖</a>
  <div class="brand"><span class="logo">🎧</span><span>الاستماع للقرآن</span></div>
  <span class="spacer"></span>
  <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌓</button>
</div></header>
<main class="container" style="max-width:640px">
  <div class="card" id="resumeCard" style="display:none;border-color:var(--gold)">
    <h3 style="margin:0 0 4px">▶️ أكمل الاستماع</h3>
    <p id="resumeTxt" style="margin:4px 0 10px"></p>
    <button class="btn btn-primary btn-block" id="resumeGo">متابعة الاستماع</button>
  </div>
  <div class="card center frame-gold"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div style="font-size:34px;line-height:1">🎧</div>
    <h3 class="lis-title-wrap" id="lisTitle">سورة</h3>
    <div class="lis-divider"><span>✦</span></div>
    <p class="quran-text" id="curAyah" style="font-size:22px;text-align:center">آية</p>
    <p class="muted" id="lisCount"></p>
    <div class="progress gold"><span id="lisBar"></span></div>
    <div class="player-btns">
      <button class="icon-btn" id="lisPrev" title="السابق">⏮</button>
      <button class="play-main" id="lisPlay" title="تشغيل / إيقاف مؤقت">▶</button>
      <button class="icon-btn" id="lisNext" title="التالي">⏭</button>
    </div>
    <div class="player-btns">
      <button class="chip-btn" id="repAyahBtn">🔁 تكرار الآية</button>
      <button class="chip-btn" id="repSurahBtn">🔂 تكرار السورة</button>
      <select id="lisSpeed" style="width:auto" title="سرعة التشغيل">
        <option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
    </div>
    <div class="player-btns">
      <button class="chip-btn on" id="modeAyahBtn">🎧 آية آية</button>
      <button class="chip-btn" id="modeFullBtn">📖 السورة كاملة</button>
      <button class="chip-btn" id="contBtn" title="تشغيل السور متتالية تلقائيًا">▶️ متواصل</button>
    </div>
  </div>
  <div class="card center"><h3 style="margin-top:0">📖 السورة</h3><select id="lisSurah"></select></div>
  <div class="card"><h3 style="margin-top:0;text-align:center">🎙️ اختر الشيخ القارئ</h3><div id="recChips" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"></div></div>
  <h3>آيات السورة (المس آية للاستماع منها)</h3>
  <div class="card"><div id="ayahList"></div></div>
  <p class="muted center">الصوت: EveryAyah (مباشر — يحتاج إنترنت) • النص: Tanzil (يعمل دون اتصال)</p>
</main>
<script src="js/storage.js"></script>`n<script src="js/firebase-config.js"></script>`n<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="data/quran-data.js"></script>
<script src="js/quran.js"></script>
<script src="data/audio-data.js"></script>
<script src="js/listen.js"></script>
</body>
</html>
