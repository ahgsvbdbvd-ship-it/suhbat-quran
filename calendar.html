<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="js/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>التقويم — صحبة القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/islamic.css">
<link rel="stylesheet" href="css/responsive.css">
<style>body{font-family:"Cairo","Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",Arial,sans-serif}</style>
</head>
<body><div id="appPreloader"><div class="pre-logo">📖</div><div class="pre-text">صحبة القرآن</div><div class="pre-bar"><span></span></div></div>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="index.html" title="الرجوع للرئيسية">→</a>
  <div class="brand"><span class="logo">📅</span><span>التقويم</span></div>
  <span class="spacer"></span>
  <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌓</button>
</div></header>
<main class="container">
  <div class="tabs" id="calTabs">
    <button class="tab" data-v="year">📅 السنة</button>
    <button class="tab active" data-v="month">📅 الشهر</button>
    <button class="tab" data-v="week">📊 الأسبوع</button>
    <button class="tab" data-v="day">🗓️ اليوم</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <button class="icon-btn" id="calPrev" title="السابق">▶</button>
      <h3 id="calTitle" style="margin:0;text-align:center">التاريخ</h3>
      <button class="icon-btn" id="calNext" title="التالي">◀</button>
    </div>
    <div class="center mt"><button class="chip-btn" id="calToday">🎯 العودة إلى اليوم</button></div>
    <div style="height:10px"></div>
    <div class="year-grid" id="yearGrid" style="display:none"></div>
    <div class="cal-grid" id="calGrid" style="display:none"></div>
    <div id="weekList" style="display:none"></div>
  </div>
  <div id="dayDetail"></div>
</main>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
