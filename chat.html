<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="js/theme-boot.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064e3b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<title>شات العائلة — صحبة القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/islamic.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
body{font-family:"Cairo","Tajawal",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",Arial,sans-serif}
#chatList{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg-row{display:flex}
.msg-row.mine{justify-content:flex-end}
.msg-row.theirs{justify-content:flex-start}
.bubble{max-width:82%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.7;word-break:normal;overflow-wrap:break-word;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.msg-row.mine .bubble{background:linear-gradient(150deg,var(--emerald),var(--emerald-deep));color:#fff;border-bottom-left-radius:6px}
.msg-row.theirs .bubble{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.6));
  border:1px solid rgba(255,255,255,.7);outline:1px solid rgba(13,122,95,.12);outline-offset:-1px;border-bottom-right-radius:6px}
body.dark .msg-row.theirs .bubble{background:linear-gradient(160deg,rgba(30,52,42,.85),rgba(18,33,27,.6));border-color:rgba(201,162,75,.25)}
.bubble .who{font-size:12px;font-weight:800;display:block;margin-bottom:2px}
.bubble .when{font-size:10px;opacity:.75;display:block;text-align:left;margin-top:2px}
.bubble .del{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;font-size:12px;padding:0 4px;font-family:inherit}
.chat-date{align-self:center;font-size:11px;font-weight:800;color:var(--muted);
  background:rgba(13,122,95,.1);border-radius:99px;padding:2px 14px}
.composer{position:sticky;bottom:86px;z-index:20;padding:10px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow-lg)}
body.dark .composer{background:linear-gradient(180deg,rgba(20,36,28,.92),rgba(12,22,17,.8));border-color:rgba(201,162,75,.3)}
.composer-row{display:flex;gap:8px}
#chatInput{flex:1}
#chatSend{min-width:56px}
.emoji-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.emoji-row button{background:none;border:1px solid rgba(13,122,95,.2);border-radius:99px;font-size:18px;cursor:pointer;padding:2px 10px}
</style>
</head>
<body><div id="appPreloader"><div class="pre-logo">📖</div><div class="pre-text">صحبة القرآن</div><div class="pre-bar"><span></span></div></div>
<header class="topbar"><div class="topbar-inner">
  <a class="icon-btn" href="index.html" title="الرجوع للرئيسية">→</a>
  <a class="icon-btn" href="family.html" title="الرجوع لنشاط العائلة">👨‍👩‍👧‍👦</a>
  <div class="brand"><span class="logo">💬</span><span>شات العائلة</span></div>
  <span class="spacer"></span>
  <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري">🌓</button>
</div></header>
<main class="container" style="max-width:600px">
  <p class="muted center">💬 <span id="unreadBadge" class="badge" style="display:none"></span> الشات يتعرف على <b>المسجلين</b> — اختر مستلمًا: العام للجميع أو فردًا لرسالة خاصة 🔒</p>
  <div id="toChips" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px"></div>
  <div class="card"><div id="chatList"></div></div>
  <div class="composer">
    <div class="composer-row">
      <input id="chatInput" placeholder="اكتب رسالتك… (Enter للإرسال)" maxlength="500" autocomplete="off">
      <button class="btn btn-primary" id="chatSend">إرسال</button>
    </div>
    <div class="emoji-row" id="emojiRow"></div>
  </div>
  <div class="center mt"><button class="chip-btn" id="chatClear">🗑️ مسح كل الرسائل</button></div>
</main>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
